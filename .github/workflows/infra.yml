name: Infrastructure

# Deploys the ForkzeroAi-Monitoring CDK stack (infra/) when infra changes land
# on main. The diff is posted to the run summary first; the deploy job waits
# for approval in the `infra` environment. ForkzeroAi-CiBootstrap (the roles
# this workflow uses) is deployed locally only. See infra/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'src/constants.ts' # SUBSCRIBE_API_URL is read at synth time
      - '.github/workflows/infra.yml'
  workflow_dispatch:

concurrency:
  group: forkzero-ai-infra
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  STACK: ForkzeroAi-Monitoring
  # Emails stay out of the repo; the app refuses to synthesize without them
  REPORT_EMAIL: ${{ secrets.REPORT_EMAIL }}
  ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

jobs:
  diff:
    name: Test and preview
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      has_changes: ${{ steps.diff.outputs.has_changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: infra

      - name: Typecheck and test
        run: npx tsc --noEmit && npm test
        working-directory: infra

      - name: Configure AWS credentials (read-only)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DIFF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK diff
        id: diff
        working-directory: infra
        run: |
          export DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items[?@=='forkzero.ai']].Id | [0]" --output text)
          # --no-change-set: a template diff needs only read access.
          # (Not --fail: it exits 1 for both "has changes" and errors.)
          set +e
          npx cdk diff "$STACK" --no-change-set > diff.txt 2>&1
          status=$?
          set -e
          sed -E 's/\x1b\[[0-9;]*m//g' diff.txt > diff-plain.txt
          {
            echo "### CDK diff: $STACK"
            echo '```'
            cat diff-plain.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ $status -ne 0 ]; then cat diff-plain.txt; exit $status; fi
          if grep -q "Number of stacks with differences: [1-9]" diff-plain.txt; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif grep -qE "Number of stacks with differences: 0|There were no differences" diff-plain.txt; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not tell whether the diff has changes"; cat diff-plain.txt; exit 1
          fi

  deploy:
    name: Deploy (requires approval)
    runs-on: ubuntu-latest
    needs: diff
    if: needs.diff.outputs.has_changes == 'true'
    environment:
      name: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: infra

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK deploy
        working-directory: infra
        run: |
          export DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items[?@=='forkzero.ai']].Id | [0]" --output text)
          # Approval already happened on the infra environment
          npx cdk deploy "$STACK" --require-approval never

      - name: Alert on failure
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          printf 'The forkzero.ai infrastructure deploy (%s) failed. CloudFormation rolls back failed updates; check the run and the stack events.\n\nCommit: %s\nRun: %s\n' \
            "$STACK" "$COMMIT_SHA" "$RUN_URL" > alert.txt
          aws sns publish --topic-arn "arn:aws:sns:${AWS_REGION}:${ACCOUNT}:forkzero-alerts" \
            --subject "[ALERT] forkzero.ai infrastructure deploy failed" --message file://alert.txt \
            || echo "::warning::Could not publish alert"
