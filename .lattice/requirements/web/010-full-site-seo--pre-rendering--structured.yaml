title: 'Full-site SEO: pre-rendering, structured data, security headers'
body: 'Full-site SEO covering pre-rendering, structured data, security headers, social sharing, and compliance. Includes: pre-render all routes with noscript fallbacks, JSON-LD structured data (Organization, WebSite, SoftwareApplication, BlogPosting, WebPage, BreadcrumbList), CloudFront Function for clean URL rewriting, security response headers (HSTS, X-Frame-Options, etc.), raster OG images for social platform compatibility, privacy policy page, proper 404 error pages, trailing-slash canonical redirects, sitemap with lastmod on all URLs, dateModified in BlogPosting schema.'
