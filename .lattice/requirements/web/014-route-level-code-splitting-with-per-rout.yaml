id: REQ-WEB-014
type: requirement
title: Route-level code splitting with per-route modulepreload
body: Each page shall load as its own JavaScript chunk so visitors download only the code for the page they open. Each pre-rendered page shall include modulepreload links for its page chunk and that chunk's shared imports, so the chunk downloads in parallel with the entry bundle. The build shall fail if a pre-rendered route has no mapped page chunk, and the Vite manifest used for this shall not be deployed.
