id: REQ-WEB-013
type: requirement
title: Central product registry drives product pages, routes and homepage grid
body: Each Forkzero product shall be defined once in src/data/products.ts. The blog product pill, the homepage Open Source grid (products with showOnHomepage, ahead of other open-source projects), the /{slug}/getting-started route, its pre-rendered HTML and JSON-LD, and its sitemap entry shall all derive from that entry. Adding a product shall need only a registry entry plus a Getting Started page component, documented in docs/ADDING_A_PRODUCT.md. Tests shall fail if a registered product has no page component or a blog post is tagged with an unregistered product.
