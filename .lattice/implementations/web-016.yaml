title: infra.yml workflow with OIDC diff and deploy roles (ForkzeroAi-CiBootstrap)
body: 'ForkzeroAi-CiBootstrap (infra/lib/ci-bootstrap-stack.ts) creates forkzero-ai-github-infra (trust: repo:forkzero/forkzero.ai:environment:infra; may assume the CDK bootstrap deploy, file-publishing and lookup roles, list distributions, publish to forkzero-alerts) and forkzero-ai-github-infra-diff (trust: repo:forkzero/forkzero.ai:ref:refs/heads/main; read-only DescribeStacks/GetTemplate/ListStackResources on ForkzeroAi-* stacks, the bootstrap version parameter and ListDistributions). .github/workflows/infra.yml runs on pushes to main touching infra/**, src/constants.ts or itself: typecheck, tests, cdk diff --no-change-set into the run summary (change detection parses the CDK summary line, since --fail also exits 1 on errors), then cdk deploy of ForkzeroAi-Monitoring in the infra environment after approval, alerting on failure. The workflow never deploys CiBootstrap; make infra-deploy deploys both stacks. Tests assert exact trust subjects, no StringLike, and the full permission sets of both roles. Setup and security model in infra/README.md.'
