id: IMP-WEB-014
type: implementation
title: React.lazy page chunks with modulepreload injected at prerender
body: App.tsx lazy-loads all six pages behind a null Suspense fallback (pre-rendered pages already show an empty root until JS runs). vite.config.ts emits a build manifest; scripts/prerender.ts maps each route to its page source (PAGE_SOURCES), walks the manifest for the page chunk and its non-entry imports, injects modulepreload links, and deletes dist/.vite. Entry bundle 328 KB to 200 KB (97.5 to 63 KB gzipped); total JS per page down 12% (home) to 32% (privacy). Homepage still loads the blog-posts chunk for the featured post (tracked in SEO-TODO.md). Tests in scripts/prerender.test.ts check each route preloads its own chunk, not others, and that the manifest is not deployed.
