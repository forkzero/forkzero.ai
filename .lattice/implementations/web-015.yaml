title: 'CDK monitoring stack: 5-minute monitor, alarms, deploy/CI alerts, health section in daily email'
body: 'CDK stack ForkzeroAi-Monitoring (infra/lib/monitoring-stack.ts, app infra/bin/forkzero-ai-infra.ts) replaces the hand-made analytics resources and the old setup-analytics.sh. It creates topics forkzero-daily-report and forkzero-alerts (email subscriptions passed at deploy time), Lambdas forkzero-daily-report and forkzero-monitor from one asset that keeps the infra/ layout (analytics-report/*.mjs plus cloudfront-url-rewrite.js and cloudfront-site-paths.json for the drift check), schedules (10:00 UTC daily, every 5 minutes), alarms forkzero-health-checks-failing (2 of 3 runs), forkzero-monitor-not-running (15 min) and forkzero-daily-report-failed, all notifying forkzero-alerts on alarm and recovery, scoped IAM (Athena primary workgroup, Glue forkzero.cloudfront_logs, logs/results buckets, CloudFront reads, PutMetricData in Forkzero/Monitor), and sns:Publish on forkzero-alerts for the GitHub Actions deploy user. checks.mjs holds the route and drift checks (23 unit tests); test/monitoring-stack.test.ts asserts the stack and the exact asset contents. deploy.yml alerts on failed deploys/smoke tests and failed CI on main. make infra-diff / infra-deploy supply the distribution ID and require REPORT_EMAIL; CI runs the infra typecheck and tests. infra/scripts/remove-legacy-analytics.sh removes the old resources after the new email is confirmed. Runbook: docs/MONITORING.md.'
